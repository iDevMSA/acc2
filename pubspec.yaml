name: monsati_accounting
description: منصتي المحاسبية — نظام محاسبي ذكي ومتكامل
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── الترجمة والتوطين (RTL / عربي) ──────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # ── Firebase ─────────────────────────────────────────────────────
  firebase_core:     ^3.1.0
  firebase_auth:     ^5.1.0
  firebase_database: ^11.0.1
  cloud_firestore:   ^5.0.1    # نظام المبيعات (sales_sys)
  google_sign_in:    ^6.3.0    # نظام المبيعات (sales_sys)

  # ── الإشعارات الفورية ────────────────────────────────────────────
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # ── PDF والطباعة ─────────────────────────────────────────────────
  pdf:      ^3.11.0
  printing: ^5.13.0

  # ── التخزين المحلي ───────────────────────────────────────────────
  shared_preferences:    ^2.3.0
  flutter_secure_storage: ^9.2.4   # نظام المبيعات (sales_sys)
  drift:                  ^2.20.0  # قاعدة بيانات SQLite محلية (بديل JSON blob)
  sqlite3_flutter_libs:   ^0.5.24
  path:                   ^1.9.0

  # ── الشبكة ───────────────────────────────────────────────────────
  http:               ^1.2.0      # مساعد الذكاء الاصطناعي
  connectivity_plus:  ^6.0.3
  dio:                ^5.4.0      # تحميل APK مع progress bar

  # ── التحديث التلقائي ─────────────────────────────────────────────
  open_file:          ^3.3.2      # تشغيل APK للتثبيت
  permission_handler: ^11.3.0     # صلاحية تثبيت مصادر مجهولة

  # ── الواجهة والأدوات ─────────────────────────────────────────────
  cupertino_icons:       ^1.0.8
  font_awesome_flutter:  ^11.0.0   # أيقونة واتساب
  google_fonts:          ^6.2.1    # نظام المبيعات (sales_sys)
  url_launcher:          ^6.3.1
  share_plus:            ^10.0.0   # نظام المبيعات (sales_sys)
  package_info_plus:     ^8.0.0    # نظام المبيعات (sales_sys)
  mobile_scanner:        ^6.0.0    # نظام المبيعات (sales_sys)
  path_provider:         ^2.1.0
  sqlite3: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev:     ^2.20.0
  build_runner:  ^2.4.13

flutter:
  uses-material-design: true

  # ── الخطوط ───────────────────────────────────────────────────────
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

  # ── الأصول ───────────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
